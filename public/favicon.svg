<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="kvRed" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="kvDark" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1f24"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <!-- Outer Hexagon with Red Tech Border -->
  <polygon
    points="60,6 108,33 108,87 60,114 12,87 12,33"
    fill="url(#kvDark)"
    stroke="url(#kvRed)"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <!-- Inner Tech Accent Lines -->
  <polygon
    points="60,15 99,37 99,83 60,105 21,83 21,37"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.12"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- Chilquinta / Power Plug Silhouette inside Hexagon -->
  <path
    d="M36 42 H84 V56 C84 67 75 74 60 74 C45 74 36 67 36 56 Z"
    fill="url(#kvRed)"
  />
  <rect x="44" y="70" width="9" height="22" rx="4.5" fill="#ffffff" />
  <rect x="67" y="70" width="9" height="22" rx="4.5" fill="#ffffff" />
  <!-- Top Tech Notch -->
  <path d="M46 28 H74" stroke="#ff2a2a" stroke-width="3" stroke-linecap="round" />
</svg>
